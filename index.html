
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nonmetal Element Checker</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #93c5fd);
            min-height: 100vh;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            width: 90%;
            max-width: 450px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;

            box-shadow: 0 8px 25px rgba(30, 64, 175, 0.2);
        }

        h1 {
            color: #1e40af;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;
            color: #1e3a8a;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #bfdbfe;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1e40af;
            transform: translateY(-2px);
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            color: #1e3a8a;
            text-align: left;
            line-height: 2;
        }

        #result:empty {
            display: none;
        }

        #result h3 {
            color: #1d4ed8;
            text-align: center;
            margin-top: 0;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1> Nonmetal Checker</h1>

        <p>Enter an element to discover its atomic information.</p>

        <label for="element">Element Name</label>

        <input
            type="text"
            id="element"
            placeholder="e.g. Hydrogen"
        >

        <button py-click="check_element">
            Check Element
        </button>

        <div id="result"></div>


    </div>

    <script type="py" src="./main.py"></script>

</body>
</html>
